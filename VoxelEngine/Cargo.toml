[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/vx_game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"   # let-chains

[workspace.dependencies]
vx_core = { path = "crates/vx_core" }
vx_gen = { path = "crates/vx_gen" }
vx_mesh = { path = "crates/vx_mesh" }
vx_physics = { path = "crates/vx_physics" }
vx_render = { path = "crates/vx_render" }
vx_ui = { path = "crates/vx_ui" }

glam = "0.33"            # та же версия, что и внутри rapier — типы совместимы без конвертаций
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
rapier3d = "0.36"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Физика и генерация в debug-сборке слишком медленные без оптимизаций
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
