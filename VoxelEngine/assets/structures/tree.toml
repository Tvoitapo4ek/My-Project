# Слои снизу вверх; в слое строки идут по Z, символы — по X.
# '.' или ' ' — не трогать, '_' — поставить воздух.
anchor = [2, 0, 2]   # эта клетка шаблона встаёт на точку размещения
palette = { L = "log", X = "leaves" }
layers = [
  [".....", ".....", "..L..", ".....", "....."],
  [".....", ".....", "..L..", ".....", "....."],
  [".....", ".....", "..L..", ".....", "....."],
  ["XXXXX", "XXXXX", "XXLXX", "XXXXX", "XXXXX"],
  [".XXX.", "XXXXX", "XXLXX", "XXXXX", ".XXX."],
  [".....", "..X..", ".XXX.", "..X..", "....."],
]
