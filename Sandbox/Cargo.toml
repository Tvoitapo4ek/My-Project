[package]
name = "sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Voxel physics sandbox: Create-like mechanisms, contraptions and physics tools"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Engine. Exact pin: avian is built against this exact minor.
bevy = { version = "=0.20.1", features = ["serialize"] }
# Physics: rigid bodies, colliders, spatial queries, forces.
avian3d = { version = "=0.8.0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
# Human-editable content files (blocks, items) with comments.
ron = "=0.12.3"
# Loading block textures into the atlas.
# Reading Blockbench models (.bbmodel is JSON).
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Bevy/Avian are unusably slow at opt-level 0.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
